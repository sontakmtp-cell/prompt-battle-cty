<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; height: 100%; background: #0b0f17; font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto minmax(620px, 78vh); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; color: #e5eefc; border-bottom: 1px solid rgba(148,163,184,.22); }
    strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a { border: 1px solid rgba(148,163,184,.3); border-radius: 8px; background: #111827; color: #e5eefc; padding: 6px 10px; text-decoration: none; }
    a:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    iframe { width: 100%; height: 100%; border: 0; background: #0b0f17; }
  </style>
</head>
<body>
  <header><strong>PROMPT CHIẾN</strong><a href="https://api.kythuatvang.com/panel/" target="_blank" rel="noopener">Mở cửa sổ riêng</a></header>
  <iframe src="https://api.kythuatvang.com/panel/" title="PROMPT Chiến bot editor và game" allow="clipboard-write" loading="eager"></iframe>
</body>
</html>
